worker_processes 1;

events {
  worker_connections 1024;
}

http {
  upstream nestjs {
    server system-a:3000;
  }

  upstream laravel {
    server system-b:8000;
  }

  server {
    listen 80;

    location /health {
      return 200 '{"status":"ok"}';
    }

    location /payments {
      proxy_pass http://nestjs;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /webhooks/ {
      proxy_pass http://nestjs;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://laravel;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
